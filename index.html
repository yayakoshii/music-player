
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>❤️音楽</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101522;color:white;
 font-family:Arial,sans-serif;
 padding:22px;
}
.app{max-width:480px;margin:auto}
.cover{
 height:210px;border-radius:22px;
 background:linear-gradient(135deg,#273b62,#795c91,#171d35);
 display:flex;align-items:center;justify-content:center;
 font-size:65px;
}
h1{text-align:center;font-size:34px;margin:20px 0 5px}
.sub{text-align:center;color:#aebbd9;font-size:12px;letter-spacing:3px}
h2{font-size:17px;margin-top:30px}
.song{
 background:#202a40;border-radius:15px;
 padding:15px;margin:10px 0;
 display:flex;align-items:center;gap:13px;
}
.play{
 border:0;border-radius:50%;width:42px;height:42px;
 background:#9a83cf;color:white;font-size:17px;
}
.info{flex:1}
.info strong{display:block;font-size:14px}
.info small{color:#aebbd9}
.footer{text-align:center;color:#9da9c4;margin-top:30px}
</style>
</head>
<body>
<div class="app">
 <div class="cover">🎧🌙</div>
 <h1>❤️音楽</h1>
 <div class="sub">YOUR ANIME MUSIC WORLD</div>
 <h2>♫ MY PLAYLIST</h2>
 <div id="songs">
  <div class="song">
   <button class="play">▶</button>
   <div class="info">
    <strong>Welcome to my playlist</strong>
    <small>❤️ 音楽 collection</small>
   </div>
   <span>♡</span>
  </div>
 </div>
 <div class="footer">あなたの音楽の世界 ♡</div>
</div>
</body>
</html>
